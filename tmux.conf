# Fix Vim ESC delay (tmux 3.5+ already defaults to 10ms)
set -sg escape-time 0
 
# Increase scrollback buffer
set -g history-limit 50000
 
# Enable mouse support
set -g mouse on
 
# Enable focus events for vim autoread
set -g focus-events on
 
# Aggressive resize for multi-client
setw -g aggressive-resize on
 
# ============================================
# KEY BINDINGS
# ============================================
 
unbind C-b
set -g prefix C-a
bind C-a send-prefix
 
# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"
 
# Better pane splitting (and keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
 
# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
 
# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
 
# ============================================
# APPEARANCE
# ============================================
 
# Status bar colors
set -g status-style 'bg=#3333cc fg=#cccccc'
set -g status-left-length 20
set -g status-right-length 50
 
# Status bar content
set -g status-left ' #S │ '
set -g status-right '│ %H:%M │ %d-%b-%y '
 
# Window status
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[fg=#cccccc] #I:#W '
 
# Pane border colors
set -g pane-border-style 'fg=#cccccc'
set -g pane-active-border-style 'fg=#cccccc'
 
# Pane scrollbars — show scrollback position (tmux 3.6+)
set -g pane-scrollbars on
set -g pane-scrollbars-position right
 
# Message styling
set -g message-style 'bg=#00e68a fg=#cccccc bold'
 
# ============================================
# COPY MODE
# ============================================
 
# Use vi keys
setw -g mode-keys vi
 
# Vi-style copy bindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"  # macOS
# bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -i"  # Linux
 
# ============================================
# PLUGINS (via TPM)
# ============================================
 
# Install TPM first:
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
 
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
 
# Plugin settings
set -g @resurrect-strategy-vim 'session'
set -g @continuum-restore 'on'
 
# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
